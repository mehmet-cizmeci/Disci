# Disci ile birlikte çalışan SQL Server Express (kurulumda "yeni SQL Server" seçildiyse .env'deki COMPOSE_FILE ekler).
services:
  sql:
    # SQL Server yalnızca x86-64 imajı olarak var; Apple Silicon Mac'lerde Docker Desktop bunu Rosetta ile çalıştırır.
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${SQL_PAROLA:?SQL_PAROLA .env dosyasinda yok}
      TZ: ${TZ:-Europe/Istanbul}
    volumes:
      - sql-veri:/var/opt/mssql
      - ./veri/Yedekler:/yedek
    # SQL Server'ın portu dışarı açılmaz; yalnızca Disci programı bağlanır.
    healthcheck:
      test: ["CMD-SHELL", "S=/opt/mssql-tools18/bin/sqlcmd; [ -x $$S ] && $$S -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  web:
    depends_on:
      sql:
        condition: service_healthy

volumes:
  sql-veri:
